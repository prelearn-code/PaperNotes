<polyline points="251,215 251,195 749,195 749,215" fill="none" stroke="#405468" stroke-width="2"/>
<polygon points="251,215 246,206 256,206" fill="#405468"/>
<polygon points="749,215 744,206 754,206" fill="#405468"/>
<g id="audit">
