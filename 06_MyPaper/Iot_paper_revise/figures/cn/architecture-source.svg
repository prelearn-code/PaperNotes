<text x="146" y="96" font-size="24" fill="#182b3a" font-weight="normal" text-anchor="middle">SDA-GGD → AEAD</text>
</g>
<polyline points="274,71 326,71" fill="none" stroke="#405468" stroke-width="2"/>
<polygon points="326,71 317,66 317,76" fill="#405468"/>
<g id="csp">
