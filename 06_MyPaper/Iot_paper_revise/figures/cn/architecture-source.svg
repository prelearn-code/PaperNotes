<text x="749" y="283" font-size="23" fill="#182b3a" font-weight="normal" text-anchor="middle">认证解密引用页，读取 BaseID</text>
<rect x="626" y="297" width="36" height="25" rx="3" fill="#ffffff" stroke="#aab7bd" stroke-width="1.6"/>
<rect x="668" y="297" width="36" height="25" rx="3" fill="#75af9e" stroke="#156557" stroke-width="1.6"/>
<rect x="710" y="297" width="36" height="25" rx="3" fill="#ffffff" stroke="#aab7bd" stroke-width="1.6"/>
<rect x="752" y="297" width="36" height="25" rx="3" fill="#ffffff" stroke="#aab7bd" stroke-width="1.6"/>
<rect x="794" y="297" width="36" height="25" rx="3" fill="#75af9e" stroke="#156557" stroke-width="1.6"/>
<rect x="836" y="297" width="36" height="25" rx="3" fill="#ffffff" stroke="#aab7bd" stroke-width="1.6"/>
