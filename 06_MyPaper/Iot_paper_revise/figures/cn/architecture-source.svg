<svg xmlns="http://www.w3.org/2000/svg" xml:lang="zh-CN" width="1000" height="441" viewBox="0 0 1000 441">
<title>ARC-Audit</title>
<g font-family="Times New Roman, SimSun, serif" fill="#182b3a">
