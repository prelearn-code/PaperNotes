<text x="251" y="251" font-size="29" fill="#205881" font-weight="bold" text-anchor="middle">公开审计</text>
<text x="251" y="283" font-size="23" fill="#182b3a" font-weight="normal" text-anchor="middle">依据公开布局规划</text>
<rect x="128" y="297" width="36" height="25" rx="3" fill="#76add3" stroke="#205881" stroke-width="1.6"/>
<rect x="170" y="297" width="36" height="25" rx="3" fill="#76add3" stroke="#205881" stroke-width="1.6"/>
<rect x="212" y="297" width="36" height="25" rx="3" fill="#76add3" stroke="#205881" stroke-width="1.6"/>
<rect x="254" y="297" width="36" height="25" rx="3" fill="#76add3" stroke="#205881" stroke-width="1.6"/>
<rect x="296" y="297" width="36" height="25" rx="3" fill="#76add3" stroke="#205881" stroke-width="1.6"/>
<rect x="338" y="297" width="36" height="25" rx="3" fill="#76add3" stroke="#205881" stroke-width="1.6"/>
