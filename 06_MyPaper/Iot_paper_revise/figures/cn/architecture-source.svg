<text x="500" y="95" font-size="24" fill="#182b3a" font-weight="normal" text-anchor="middle">签名清单</text>
<text x="813" y="95" font-size="24" fill="#182b3a" font-weight="normal" text-anchor="middle">密文页与审计标签</text>
</g>
<polyline points="500,107 500,140" fill="none" stroke="#405468" stroke-width="2"/>
