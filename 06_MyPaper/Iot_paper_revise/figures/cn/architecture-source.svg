<text x="749" y="384" font-size="23" fill="#156557" font-weight="bold" text-anchor="middle">D(T) → 取页并解码记录</text>
<text x="749" y="410" font-size="19" fill="#182b3a" font-weight="normal" text-anchor="middle">可选的预算约束 RS 修复</text>
